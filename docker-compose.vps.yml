# Выкладка на VPS. Порт снаружи задаётся MAYAK_PORT (по умолчанию 8090).
# Внутри контейнера приложение слушает 8787.
#
#   MAYAK_PORT=8090 JWT_SECRET="$(openssl rand -hex 32)" docker compose -f docker-compose.vps.yml up -d --build
#
# Поиск: SEARXNG_URL, либо ключ Brave/Tavily в настройках админа.
# Песочница run_code выключена, пока админ её не включит. Для неё на хосте нужен Docker.
# Telegram: токен бота сохраняется в настройках, не в этом файле.

services:
  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MAYAK_AUTH: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      DATABASE_URL: postgres://mayak:${POSTGRES_PASSWORD:-mayak}@db:5432/mayak
      DATA_DIR: /app/data
      MAYAK_PUBLIC_URL: ${MAYAK_PUBLIC_URL:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "${MAYAK_PORT:-8090}:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mayak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mayak}
      POSTGRES_DB: mayak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayak -d mayak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
