# Выход в интернет для песочницы: только адреса из filter (пакеты и GitHub).
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Notice
Allow 0.0.0.0/0
ConnectPort 443
ConnectPort 80
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off
Filter "/etc/tinyproxy/filter"
DisableViaHeader Yes
