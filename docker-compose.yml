# Маяк: приложение + Postgres.
# Смените пароль базы и JWT_SECRET перед выкладкой.
# HTTPS: docker compose --profile https up -d --build
# и MAYAK_DOMAIN=mayak.example.com. Caddy выпускает сертификат и проксирует на app:8787.
# В этом режиме поставьте COOKIE_SECURE=1 у сервиса app.

services:
  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MAYAK_AUTH: "1"
      COOKIE_SECURE: "0"
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      DATABASE_URL: postgres://mayak:mayak@db:5432/mayak
      DATA_DIR: /app/data
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mayak
      POSTGRES_PASSWORD: mayak
      POSTGRES_DB: mayak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayak -d mayak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  caddy:
    profiles: ["https"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAYAK_DOMAIN: ${MAYAK_DOMAIN:-mayak.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
